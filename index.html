<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI API Kulcs Igénylés</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>API Kulcs Kölcsönzés</h2>
    <form id="keyForm">
        <label for="username">Adja meg a nevét:</label>
        <input type="text" id="username" required placeholder="Teljes név">
        <button type="submit">Kulcs kérése</button>
    </form>

    <div id="resultBox" class="result">
        <strong>Generált API Kulcs:</strong>
        <p id="apiKeyDisplay" style="font-family: monospace; font-size: 14px; margin-top: 5px;"></p>
    </div>
</div>

<script>
    document.getElementById('keyForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const name = document.getElementById('username').value;
        
        if (name.trim() !== '') {
            const staticKey = "AIzaSyBVVGUb0squnQlorx4hnObWdkfG3FAnLU8";
            
            document.getElementById('apiKeyDisplay').textContent = staticKey;
            document.getElementById('resultBox').style.display = 'block';
        }
    });
</script>

</body>
</html>
