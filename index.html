<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core - Key Station</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #7000ff;
            --accent: #ff007b;
            --bg: #0a0b10;
            --card-bg: rgba(18, 20, 32, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Részecskék háttere */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Fő Kártya Design */
        .container {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15),
                        inset 0 0 20px rgba(112, 0, 255, 0.1);
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        p.subtitle {
            text-align: center;
            color: #8a8fbf;
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Input Form */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.02);
        }

        .input-group label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c7293;
            pointer-events: none;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -10px;
            left: 12px;
            font-size: 12px;
            padding: 2px 8px;
            background: var(--bg);
            border-radius: 4px;
            color: var(--primary);
        }

        /* Neon Gomb */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Betöltő animáció */
        .loader {
            display: none;
            margin: 25px auto 0;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--primary);
            font-size: 13px;
            letter-spacing: 1px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        /* Eredmény Box */
        .result-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .key-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .key-text {
            font-family: monospace;
            color: #fff;
            font-size: 13px;
            word-break: break-all;
            margin-right: 10px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container">
        <h1>AI API ACCESS</h1>
        <p class="subtitle">Kérj azonnali hozzáférési kulcsot</p>

        <form id="keyForm">
            <div class="input-group">
                <input type="text" id="username" required autocomplete="off">
                <label for="username">Teljes Név</label>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">KULCS LEKÉRÉSE</button>
        </form>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loader-text">HOZZÁFÉRÉS HITELESÍTÉSE...</div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-header">Sikeres Hozzáférés!</div>
            <div class="key-container">
                <span class="key-text" id="keyDisplay"></span>
                <button class="copy-btn" id="copyBtn">MÁSOLÁS</button>
            </div>
        </div>
    </div>

    <script>
        // Részecske animáció a háttérben
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Űrlap kezelés és szimulált töltés
        const form = document.getElementById('keyForm');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        const keyDisplay = document.getElementById('keyDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const copyBtn = document.getElementById('copyBtn');

        const staticKey = "AIzaSyBVVGUb0squnQlorx4hnObWdkfG3FAnLU8";

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // UI állapotváltás
            submitBtn.style.display = 'none';
            resultBox.style.display = 'none';
            loader.style.display = 'block';

            // Szimulált látványos várakozási idő (1.5 másodperc)
            setTimeout(() => {
                loader.style.display = 'none';
                keyDisplay.textContent = staticKey;
                resultBox.style.display = 'block';
                submitBtn.style.display = 'block';
                submitBtn.textContent = 'ÚJRA KÉRÉS';
            }, 1500);
        });

        // Másolás funkció
        copyBtn.addEventListener('click', function() {
            navigator.clipboard.writeText(staticKey).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'MÁSOLVA!';
                copyBtn.style.background = 'var(--primary)';
                copyBtn.style.color = '#000';

                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.style.background = 'transparent';
                    copyBtn.style.color = 'var(--primary)';
                }, 2000);
            });
        });
    </script>
</body>
</html>
